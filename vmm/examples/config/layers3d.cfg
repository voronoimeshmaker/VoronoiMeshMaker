# Title: Configuration file - 3D layers crossed by a well
# Description: A vmm-mesh configuration file in 3D: a rock block, a clay
#              layer declared after it on its upper part, and a cylindrical
#              well as a hole. No C++: run vmm-mesh layers3d.cfg.
# SPDX-License-Identifier: BSD-3-Clause
dimension = 3
seed = 3

[region rock]
shape = cuboid
lo = 0 0 0
hi = 1 1 0.5
z- = floor
z+ = top
sites = uniform
sites.spacing = 0.1

[region clay]          # upper layer: covers the rock between z = 0.3 and 0.5
shape = cuboid
lo = 0 0 0.3
hi = 1 1 0.5
z+ = top
sites = uniform
sites.spacing = 0.07

[hole well]
shape = cylinder
base = 0.5 0.5 0.1
radius = 0.08
height = 0.4
side = well
top = well
bottom = well
