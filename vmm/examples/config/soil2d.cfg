# Title: Configuration file - 2D soil with a lens and a well
# Description: A vmm-mesh configuration file: a soil block, a sand lens
#              declared after it (it covers the soil where they overlap) and
#              a circular well as a hole. No C++: run vmm-mesh soil2d.cfg.
# SPDX-License-Identifier: BSD-3-Clause
dimension = 2
seed = 7

[region soil]
shape = rectangle
lo = 0 0
hi = 4 2
bottom = base
top = surface
left = west
right = east
sites = uniform
sites.spacing = 0.12

[region lens]          # declared later: covers the soil where they overlap
medium = sand
shape = ellipse
center = 2.6 1
axes = 0.8 0.35
sites = uniform
sites.spacing = 0.06

[hole well]
shape = circle
center = 1 1
radius = 0.15
tag = well
