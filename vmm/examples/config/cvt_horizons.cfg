# Title: Volumetric CVT with fixed horizons
# Description: The original columns may change; the interface stays at z=1.
dimension = 2
horizons = cvt_horizons.hgrid
cvt_iterations = 8
output = cvt_volumetric
[region base]
medium = geometry
shape = rectangle
lo = 0 0
hi = 2 1
sites = grid
sites.spacing = 0.4
