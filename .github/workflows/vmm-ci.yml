# SPDX-License-Identifier: BSD-3-Clause
# CI of the new library (vmm/), P07: compilers (DEC-022 minimum and latest),
# Debug/Release, sanitizers, coverage per file (R25) and static checks of the
# P05 baseline.
name: vmm-ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CGAL_VERSION: "6.2.1"

jobs:
  build-test:
    name: ${{ matrix.compiler }} ${{ matrix.build_type }}${{ matrix.sanitize == 'ON' && ' sanitize' || '' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { compiler: gcc-14, cxx: g++-14, build_type: Debug, sanitize: "OFF" }
          - { compiler: gcc-14, cxx: g++-14, build_type: Release, sanitize: "OFF" }
          - { compiler: clang-19, cxx: clang++-19, build_type: Release, sanitize: "OFF" }  # DEC-042
          - { compiler: gcc-14, cxx: g++-14, build_type: Debug, sanitize: "ON" }
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-14 clang-19 libboost-dev libgmp-dev libmpfr-dev \
            libgtest-dev libgmock-dev libtbb-dev zlib1g-dev python3
      - name: CGAL ${{ env.CGAL_VERSION }} (release tarball; the distribution package is older)
        run: |
          curl -fsSL -o cgal.tar.xz \
            https://github.com/CGAL/cgal/releases/download/v${CGAL_VERSION}/CGAL-${CGAL_VERSION}.tar.xz
          tar xf cgal.tar.xz
          cmake -S CGAL-${CGAL_VERSION} -B cgal-build -DCMAKE_INSTALL_PREFIX=$HOME/cgal
          cmake --install cgal-build
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_PREFIX_PATH=$HOME/cgal \
            -DVMM_BUILD_EXAMPLES=OFF -DVMM_BUILD_TESTS=ON \
            -DVMM_SANITIZE=${{ matrix.sanitize }}
      - name: Build
        run: |
          set +e
          cmake --build build -j 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            # Public annotations: the job log needs a login, the annotations do not.
            grep -E "error:|Error |Killed|No such file|not found" build.log | head -20 | sed 's/^/::error::/'
          fi
          exit $status
      - name: Test
        env:
          UBSAN_OPTIONS: print_stacktrace=1
        # The heavy integration tests (label "slow") take minutes in Debug; under the
        # sanitizers they would exceed the time limits, so that job skips them.
        run: |
          set +e
          exclude=""
          [ "${{ matrix.sanitize }}" = "ON" ] && exclude="-LE slow"
          ctest --test-dir build -L vmm $exclude --output-on-failure -j 4 --timeout 3600 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            # Public annotations: names of the failed tests and the failure lines of their output.
            sed 's/^/::error::failed test /' build/Testing/Temporary/LastTestsFailed.log | head -20
            grep -E "Failure|Expected|Which is|Value of|actual|error:|Sanitizer|runtime error" test.log \
              | head -30 | sed 's/^/::error::/'
          fi
          exit $status

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-14 libboost-dev libgmp-dev libmpfr-dev libgtest-dev \
            libgmock-dev libtbb-dev zlib1g-dev python3-pip
          pip install --user gcovr
      - name: CGAL
        run: |
          curl -fsSL -o cgal.tar.xz \
            https://github.com/CGAL/cgal/releases/download/v${CGAL_VERSION}/CGAL-${CGAL_VERSION}.tar.xz
          tar xf cgal.tar.xz && cmake -S CGAL-${CGAL_VERSION} -B cgal-build -DCMAKE_INSTALL_PREFIX=$HOME/cgal
          cmake --install cgal-build
      - name: Build with coverage
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH=$HOME/cgal -DVMM_BUILD_EXAMPLES=OFF -DVMM_BUILD_TESTS=ON -DVMM_COVERAGE=ON
          set +e
          cmake --build build -j 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            # Public annotations: the job log needs a login, the annotations do not.
            grep -E "error:|Error |Killed|No such file|not found" build.log | head -20 | sed 's/^/::error::/'
          fi
          [ $status -eq 0 ] || exit $status
          set -e
          ctest --test-dir build -L vmm -j 4 --timeout 3600
      - name: Coverage per file (R25)
        run: cmake --build build --target vmm_coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: build/vmm_coverage.*

  static-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Baseline requirements (R1-R4, R8, R13, R21, R23, include order)
        run: python3 vmm/tools/ci/check_requirements.py --root vmm
